<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .overlay-wrapper {
    background: rgba(0,0,0,0.95);
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 8px 40px rgba(0,0,0,0.9);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 480px;
  }

  /* HEADER */
  .top-header { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .top-header .line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  .top-title { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 11px; letter-spacing: 5px; color: rgba(255,255,255,0.35); text-transform: uppercase; white-space: nowrap; }

  /* 2 colonnes de 3 jours */
  .days-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, auto);
    gap: 6px;
  }

  .day-block { display: flex; flex-direction: column; gap: 3px; }

  .day-label { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,0.45); text-transform: uppercase; text-align: center; }

  .score-cell {
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 7px 8px 5px; gap: 3px;
    transition: all 0.4s;
  }
  .score-cell.green { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.7); box-shadow: 0 0 12px rgba(34,197,94,0.2); }
  .score-cell.red   { background: rgba(239,68,68,0.2);  border-color: rgba(239,68,68,0.7); box-shadow: 0 0 12px rgba(239,68,68,0.2); }

  .score-number { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 26px; color: #fff; letter-spacing: 2px; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,1); overflow: hidden; max-width: 100%; text-align: center; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; word-break: break-all; }

  .mvp-cell {
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    padding: 5px 8px; gap: 4px;
    transition: all 0.4s;
  }
  .mvp-cell.gold { background: rgba(234,179,8,0.22); border-color: rgba(234,179,8,0.8); box-shadow: 0 0 12px rgba(234,179,8,0.3); }

  .mvp-row { display: flex; align-items: center; gap: 3px; width: 100%; justify-content: center; }
  .mvp-badge { font-family: 'Rajdhani', Arial, sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.3); text-transform: uppercase; border: 1px solid rgba(255,255,255,0.12); border-radius: 2px; padding: 0 3px; flex-shrink: 0; }
  .mvp-cell.gold .mvp-badge { color: rgba(234,179,8,0.9); border-color: rgba(234,179,8,0.5); }
  .mvp-name { font-family: 'Rajdhani', Arial, sans-serif; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; word-break: break-word; text-align: center; }

  /* SEP */
  .sep { display: flex; align-items: center; gap: 6px; }
  .sep .l { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
  .sep .d { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); }

  /* BOTTOM */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: stretch; }

  .total-cell { border-radius: 8px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 8px; gap: 0; transition: all 0.4s; }
  .total-cell.green { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.7); box-shadow: 0 0 16px rgba(34,197,94,0.25); }
  .total-cell.red   { background: rgba(239,68,68,0.2);  border-color: rgba(239,68,68,0.7); box-shadow: 0 0 16px rgba(239,68,68,0.25); }
  .total-lbl { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 8px; letter-spacing: 3px; color: rgba(255,255,255,0.3); }
  .total-num { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 28px; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0,0,0,1); line-height: 1; }

  .mvp-total-cell { border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: all 0.4s; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); }
  .mvp-total-cell.gold { background: rgba(234,179,8,0.18); border: 1.5px solid rgba(234,179,8,0.7); box-shadow: 0 0 16px rgba(234,179,8,0.3); }
  .mvp-total-lbl { font-family: 'Rajdhani', Arial, sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(234,179,8,0.85); }
  .mvp-total-name { font-family: 'Rajdhani', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; overflow: hidden; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; word-break: break-word; }

  /* ENJEU */
  .enjeu-cell { border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 6px 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .enjeu-cell::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, rgba(34,197,94,0.8), rgba(239,68,68,0.8)); }
  .enjeu-txt { font-family: 'Rajdhani', Arial, sans-serif; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); text-align: center; text-transform: uppercase; letter-spacing: 0.8px; line-height: 1.4; }
</style>
</head>
<body>
<div class="overlay-wrapper">

  <div class="top-header">
    <div class="line"></div>
    <div class="top-title">Score de la semaine</div>
    <div class="line"></div>
  </div>

  <div class="days-grid" id="calGrid"></div>

  <div class="sep"><div class="l"></div><div class="d"></div><div class="l"></div></div>

  <div class="bottom-row">
    <div class="total-cell" id="totalCell">
      <div class="total-lbl">TOTAL</div>
      <div class="total-num" id="totalNum"></div>
    </div>
    <div class="mvp-total-cell" id="mvpTotalCell">
      <span class="mvp-total-lbl">⭐ MVP de la semaine</span>
      <div class="mvp-total-name" id="mvpTotalName"></div>
    </div>
  </div>

  <div class="enjeu-cell">
    <div class="enjeu-txt" id="enjeuTxt">MVP DE L'EQUIPE GAGNANTE = MAITRE DE MON PSEUDO 7 JOURS</div>
  </div>

</div>

<script>
  const BIN_ID = 'd9b3e782f440cad27817';
  const DAYS = ['LUN','MAR','MER','JEU','VEN','SAM'];
  // Ordre : LUN|JEU / MAR|VEN / MER|SAM
  const ORDER = [0,3,1,4,2,5];
  const grid = document.getElementById('calGrid');
  const sCells = {}, sNums = {}, mCells = {}, mNames = {};

  ORDER.forEach(i => {
    const day = DAYS[i];
    const block = document.createElement('div'); block.className = 'day-block';
    const lbl = document.createElement('div'); lbl.className = 'day-label'; lbl.textContent = day;

    const sc = document.createElement('div'); sc.className = 'score-cell';
    const sn = document.createElement('div'); sn.className = 'score-number';
    sc.appendChild(sn);

    const mc = document.createElement('div'); mc.className = 'mvp-cell';
    const mr = document.createElement('div'); mr.className = 'mvp-row';
    const mb = document.createElement('span'); mb.className = 'mvp-badge'; mb.textContent = 'MVP';
    const mn = document.createElement('div'); mn.className = 'mvp-name';
    mr.appendChild(mb); mr.appendChild(mn);
    mc.appendChild(mr);

    block.appendChild(lbl); block.appendChild(sc); block.appendChild(mc);
    grid.appendChild(block);
    sCells[i] = sc; sNums[i] = sn; mCells[i] = mc; mNames[i] = mn;
  });

  function getNum(str) {
    const s = String(str || '').replace(',', '.').replace(/\s/g, '').trim();
    if (!s) return null;
    const m = s.match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  function formatNum(n) {
    if (n === null) return '';
    return n.toLocaleString('fr-FR').replace(/ /g, ' ');
  }
  function getColor(txt) { const n = getNum(txt); if (n === null) return ''; return n > 0 ? 'green' : 'red'; }
  function topOf(map) {
    let top = '', cnt = 0;
    Object.entries(map).forEach(([p,c]) => { if (c > cnt) { cnt = c; top = p; } });
    return top ? top + (cnt > 1 ? ' x' + cnt : '') : '—';
  }

  async function load() {
    try {
      const r = await fetch('https://api.npoint.io/' + BIN_ID + '?t=' + Date.now() + '_' + Math.random(), {
        cache: 'no-store', headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
      });
      if (!r.ok) return;
      const data = await r.json();
      let sum = 0;
      const mvpAll = {};
      DAYS.forEach((_, i) => {
        const d = data['day-' + i] || {};
        const m = data['mvp-' + i] || {};
        const color = getColor(d.text);
        const num = getNum(d.text);
        if (num !== null) sum += num;
        sCells[i].className = 'score-cell' + (color ? ' ' + color : '');
        sNums[i].textContent = d.text || '';
        const p = (m.text || '').trim();
        mNames[i].textContent = p.toUpperCase();
        mCells[i].className = 'mvp-cell' + (p ? ' gold' : '');
        if (p) mvpAll[p.toUpperCase()] = (mvpAll[p.toUpperCase()] || 0) + 1;
      });
      const c = sum > 0 ? 'green' : 'red';
      document.getElementById('totalCell').className = 'total-cell ' + c;
      document.getElementById('totalNum').textContent = formatNum(sum);
      const topMvp = topOf(mvpAll);
      document.getElementById('mvpTotalName').textContent = topMvp === '—' ? '' : topMvp;
      document.getElementById('mvpTotalCell').className = 'mvp-total-cell' + (topMvp !== '—' ? ' gold' : '');
      const enjeu = data['enjeu'] || {};
      if (enjeu.text) document.getElementById('enjeuTxt').textContent = enjeu.text.toUpperCase();
    } catch(e) {}
  }

  load();
  setInterval(load, 2000);
</script>
</body>
</html>
