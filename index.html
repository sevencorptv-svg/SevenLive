<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Bebas Neue', Impact, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .overlay-wrapper {
    background: rgba(0,0,0,0.95);
    border-radius: 18px;
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 10px 50px rgba(0,0,0,0.9);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 420px;
  }

  /* HEADER */
  .top-header {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .top-header .line { flex: 1; height: 1px; }
  .top-header .line.l { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2)); }
  .top-header .line.r { background: linear-gradient(90deg, rgba(255,255,255,0.2), transparent); }
  .top-title {
    font-size: 13px; letter-spacing: 5px;
    color: rgba(255,255,255,0.4); text-transform: uppercase;
  }

  /* GRID 2 colonnes */
  .days-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .day-block { display: flex; flex-direction: column; gap: 5px; }

  .day-label {
    font-size: 13px; letter-spacing: 4px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase; text-align: center;
  }

  .score-cell {
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 8px 6px;
    gap: 4px;
    overflow: hidden;
    transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
  }
  .score-cell.green {
    background: rgba(34,197,94,0.2);
    border-color: rgba(34,197,94,0.7);
    box-shadow: 0 0 18px rgba(34,197,94,0.2);
  }
  .score-cell.red {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.7);
    box-shadow: 0 0 18px rgba(239,68,68,0.2);
  }

  .score-number {
    font-size: 30px; color: #fff;
    letter-spacing: 2px; line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,1);
    overflow: hidden; max-width: 100%; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    word-break: break-all;
  }

  .mvp-row {
    display: flex; align-items: center; gap: 4px;
    width: 100%;
  }
  .mvp-badge {
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.35); text-transform: uppercase;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px; padding: 1px 3px;
  }
  .mvp-name {
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,0.85); text-transform: uppercase;
    letter-spacing: 0.5px; overflow: hidden; flex: 1; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    word-break: break-word;
  }

  /* SEPARATEUR */
  .sep {
    display: flex; align-items: center; gap: 6px;
  }
  .sep .l { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
  .sep .d { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.15); }

  /* BOTTOM */
  .bottom-section { display: flex; flex-direction: column; gap: 8px; }

  /* TOTAL */
  .total-cell {
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.15);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 14px; gap: 2px;
    transition: all 0.4s;
  }
  .total-cell.green { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.7); box-shadow: 0 0 22px rgba(34,197,94,0.25); }
  .total-cell.red   { background: rgba(239,68,68,0.2);  border-color: rgba(239,68,68,0.7); box-shadow: 0 0 22px rgba(239,68,68,0.25); }
  .total-lbl { font-size: 10px; letter-spacing: 5px; color: rgba(255,255,255,0.3); }
  .total-num { font-size: 36px; color: #fff; letter-spacing: 3px; text-shadow: 0 2px 14px rgba(0,0,0,1); line-height: 1; }

  /* MVP EQUIPES */
  .mvp-teams {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .team-cell {
    border-radius: 10px; padding: 8px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: all 0.4s;
  }
  .team-cell.green { background: rgba(34,197,94,0.1); border: 1.5px solid rgba(34,197,94,0.35); }
  .team-cell.red   { background: rgba(239,68,68,0.1);  border: 1.5px solid rgba(239,68,68,0.35); }
  .team-lbl {
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  }
  .team-lbl.green { color: rgba(34,197,94,0.8); }
  .team-lbl.red   { color: rgba(239,68,68,0.8); }
  .team-name {
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 15px; font-weight: 700; color: #fff;
    text-transform: uppercase; letter-spacing: 1px; text-align: center;
    overflow: hidden; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    word-break: break-word;
  }

  /* ENJEU */
  .enjeu-cell {
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px;
    position: relative; overflow: hidden;
  }
  .enjeu-cell::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, rgba(34,197,94,0.8), rgba(239,68,68,0.8));
  }
  .enjeu-txt {
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,0.6);
    text-align: center; text-transform: uppercase;
    letter-spacing: 1px; line-height: 1.4;
  }
</style>
</head>
<body>
<div class="overlay-wrapper">

  <div class="top-header">
    <div class="line l"></div>
    <div class="top-title">Score de la semaine</div>
    <div class="line r"></div>
  </div>

  <div class="days-grid" id="calGrid"></div>

  <div class="sep"><div class="l"></div><div class="d"></div><div class="l"></div></div>

  <div class="bottom-section">
    <div class="total-cell" id="totalCell">
      <div class="total-lbl">TOTAL</div>
      <div class="total-num" id="totalNum"></div>
    </div>
    <div class="mvp-teams">
      <div class="team-cell green">
        <span class="team-lbl green">Equipe Verte</span>
        <div class="team-name" id="mvpGreen"></div>
      </div>
      <div class="team-cell red">
        <span class="team-lbl red">Equipe Rouge</span>
        <div class="team-name" id="mvpRed"></div>
      </div>
    </div>
    <div class="enjeu-cell">
      <div class="enjeu-txt" id="enjeuTxt">MVP DE L'EQUIPE GAGNANTE = MAITRE DE MON PSEUDO 7 JOURS</div>
    </div>
  </div>

</div>

<script>
  const BIN_ID = 'd9b3e782f440cad27817';
  const DAYS = ['LUN','MAR','MER','JEU','VEN','SAM'];
  const ORDER = [0,3,1,4,2,5];
  const grid = document.getElementById('calGrid');
  const sCells = {}, sNums = {}, mNames = {};

  ORDER.forEach(i => {
    const block = document.createElement('div'); block.className = 'day-block';

    const lbl = document.createElement('div'); lbl.className = 'day-label';
    lbl.textContent = DAYS[i]; block.appendChild(lbl);

    const sc = document.createElement('div'); sc.className = 'score-cell';
    const sn = document.createElement('div'); sn.className = 'score-number';
    const mr = document.createElement('div'); mr.className = 'mvp-row';
    const mb = document.createElement('span'); mb.className = 'mvp-badge'; mb.textContent = 'MVP';
    const mn = document.createElement('div'); mn.className = 'mvp-name';
    mr.appendChild(mb); mr.appendChild(mn);
    sc.appendChild(sn); sc.appendChild(mr);
    block.appendChild(sc);
    grid.appendChild(block);

    sCells[i] = sc; sNums[i] = sn; mNames[i] = mn;
  });

  function getNum(str) {
    const s = String(str || '').replace(',', '.').trim();
    if (!s) return null;
    const m = s.match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  function getColor(txt) {
    const n = getNum(txt);
    if (n === null) return '';
    return n > 0 ? 'green' : 'red';
  }
  function topOf(map) {
    let top = '', cnt = 0;
    Object.entries(map).forEach(([p,c]) => { if (c > cnt) { cnt = c; top = p; } });
    return top ? top + (cnt > 1 ? ' x' + cnt : '') : '—';
  }

  async function load() {
    try {
      const r = await fetch('https://api.npoint.io/' + BIN_ID + '?t=' + Date.now() + '_' + Math.random(), {
        cache: 'no-store', headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
      });
      if (!r.ok) return;
      const data = await r.json();
      let sum = 0;
      const mvpG = {}, mvpR = {};

      DAYS.forEach((_, i) => {
        const d = data['day-' + i] || {};
        const m = data['mvp-' + i] || {};
        const color = getColor(d.text);
        const num = getNum(d.text);
        if (num !== null) sum += num;
        sCells[i].className = 'score-cell' + (color ? ' ' + color : '');
        sNums[i].textContent = d.text || '';
        mNames[i].textContent = (m.text || '').toUpperCase();
        const p = (m.text || '').trim().toUpperCase();
        if (p) {
          if (color === 'green') mvpG[p] = (mvpG[p] || 0) + 1;
          if (color === 'red')   mvpR[p] = (mvpR[p] || 0) + 1;
        }
      });

      const c = sum > 0 ? 'green' : 'red';
      document.getElementById('totalCell').className = 'total-cell ' + c;
      document.getElementById('totalNum').textContent = sum;
      document.getElementById('mvpGreen').textContent = topOf(mvpG);
      document.getElementById('mvpRed').textContent   = topOf(mvpR);
      const enjeu = data['enjeu'] || {};
      if (enjeu.text) document.getElementById('enjeuTxt').textContent = enjeu.text.toUpperCase();
    } catch(e) {}
  }

  load();
  setInterval(load, 2000);
</script>
</body>
</html>
